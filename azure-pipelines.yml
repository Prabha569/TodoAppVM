trigger: none
pool: Prabhas-Agent-Pools

# variables:
#   config_path: '$(System.DefaultWorkingDirectory)/todoapp_infra'


steps:
- task: TerraformInstaller@1
  displayName: Terraform Install 
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  displayName: Terraform Init
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/todoapp_infra'
    backendServiceArm: 'PrabhaSC-WIF'
    backendAzureRmResourceGroupName: 'rg-rama'
    backendAzureRmStorageAccountName: 'krishnastg5678'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'prod.terraform.tfstate'

- task: TerraformTask@5
  displayName: Terraform Fmt
  inputs:
    provider: 'azurerm'
    command: 'custom'
    workingDirectory: '$(System.DefaultWorkingDirectory)/todoapp_infra'
    outputTo: 'console'
    customCommand: 'fmt'
    environmentServiceNameAzureRM: 'PrabhaSC-WIF'
- task: TerraformTask@5
  displayName: Terraform Validate
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: $(config_path) 

- task: TerraformTask@5
  displayName: Terraform Plan
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/todoapp_infra'
    environmentServiceNameAzureRM: 'PrabhaSC-WIF'

